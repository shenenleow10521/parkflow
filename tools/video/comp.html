<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParkFlow demo video</title>
<style>
:root {
  --night: #0a111c; --deck: #121c2b; --deck2: #172334; --deck3: #1e2c41; --line: #22324a; --line2: #30435f;
  --chalk: #ebf0f6; --chalk2: #b8c5d6; --fog: #8696ad; --sign: #2f6fe0; --signhi: #7ea8ff;
  --gold: #e3c35a; --goldhi: #f5dd8f; --go: #34e58a; --amber: #ffb21f; --stop: #ff4d5e;
  --ladies: #ff6fb8; --oku: #4d94ff; --held: #b48cff; --teal: #2dd4bf;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04070c; }
body { font-family: Inter, sans-serif; color: var(--chalk); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(110% 85% at 50% 28%, #101b2d 0%, #0a111c 52%, #05090f 100%); }
.scene { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.h1 { font: 700 96px/1.04 'Inter Display', Inter, sans-serif; letter-spacing: -0.024em; }
.h2 { font: 700 60px/1.08 'Inter Display', Inter, sans-serif; letter-spacing: -0.02em; }
.h3 { font: 650 34px/1.18 'Inter Display', Inter, sans-serif; letter-spacing: -0.01em; }
.lede { font: 400 29px/1.42 Inter, sans-serif; color: var(--chalk2); }
.body { font: 400 23px/1.42 Inter, sans-serif; color: var(--chalk2); }
.small { font: 500 21px/1.35 Inter, sans-serif; color: var(--fog); }
.num { font-variant-numeric: tabular-nums; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.03em 0.16em; margin: 0 -0.03em -0.16em; }
.w > span { display: inline-block; will-change: transform; }
.card { background: linear-gradient(180deg, rgba(31, 46, 68, 0.78), rgba(17, 27, 42, 0.86)); border: 1px solid var(--line2); border-radius: 26px; box-shadow: 0 34px 90px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(23, 35, 52, 0.85); font: 500 22px/1.2 Inter; color: var(--chalk); white-space: nowrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
.ledbox { position: absolute; padding: 18px; border-radius: 18px; background: linear-gradient(180deg, #070b12, #04070c); border: 1px solid #1d2a3c; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.65), inset 0 0 0 6px #0b111b, inset 0 2px 0 rgba(255, 255, 255, 0.05); }
.ledbox canvas { display: block; }
.ic { width: 1em; height: 1em; display: inline-block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icbox { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; }

/* global chrome */
#amb { position: absolute; inset: 0; pointer-events: none; }
#amb .g { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; }
#amb .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(126, 168, 255, 0.075) 1.3px, transparent 1.8px); background-size: 30px 30px; -webkit-mask-image: radial-gradient(80% 70% at 50% 45%, #000 30%, transparent 85%); }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.035; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(2, 4, 8, 0.55) 100%); }
#topgrad { position: absolute; left: 0; right: 0; top: 0; height: 220px; pointer-events: none; background: linear-gradient(180deg, rgba(3, 6, 11, 0.95), rgba(3, 6, 11, 0.72) 50%, transparent); }
#capgrad { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(3, 6, 11, 0.62)); }
#chap { position: absolute; left: 96px; top: 52px; display: flex; align-items: center; gap: 16px; }
#chap .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(160deg, #3f7ef0, #2559c8); display: grid; place-items: center; font: 800 26px/1 'Inter Display'; color: #fff; box-shadow: 0 8px 24px rgba(47, 111, 224, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
#chap .t { position: relative; height: 56px; width: 700px; }
#chap .t > div { position: absolute; left: 0; top: 0; }
#chap b { display: block; font: 650 25px/1.2 'Inter Display'; color: var(--chalk); letter-spacing: -0.005em; }
#chap span { display: block; font: 500 18px/1.4 Inter; color: var(--fog); margin-top: 2px; }
#prog { position: absolute; left: 96px; right: 96px; bottom: 26px; height: 4px; display: flex; gap: 8px; }
#prog i { display: block; height: 4px; border-radius: 2px; background: rgba(126, 168, 255, 0.16); overflow: hidden; position: relative; }
#prog i b { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #4c86ef, #8db3ff); border-radius: 2px; }

/* command centre */
.appwin { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; border-radius: 22px; overflow: hidden; background: #0b1220; box-shadow: 0 60px 160px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(126, 168, 255, 0.16); }
.appwin > img, .appwin .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.page { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.page .content { position: absolute; inset: 0; overflow: hidden; clip-path: inset(77px 0 0 92px); }
.page .content img, .page .chrome img { position: absolute; left: 0; top: 0; width: 1920px; }
.page .chrome { position: absolute; inset: 0; overflow: hidden; }
.spot { position: absolute; border-radius: 16px; border: 3px solid #8db3ff; box-shadow: 0 0 0 5000px rgba(4, 8, 15, 0.62), 0 0 40px rgba(126, 168, 255, 0.45); pointer-events: none; }
.ring { position: absolute; border-radius: 14px; border: 3px solid var(--goldhi); box-shadow: 0 0 26px rgba(245, 221, 143, 0.55); }
.callout { position: absolute; width: 470px; padding: 26px 30px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(25, 38, 58, 0.96), rgba(14, 22, 35, 0.97)); border: 1px solid rgba(126, 168, 255, 0.35); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
.callout::before { content: ""; position: absolute; left: 0; top: 22px; bottom: 22px; width: 5px; border-radius: 0 4px 4px 0; background: var(--acc, #7ea8ff); }
.callout b { display: block; font: 650 31px/1.18 'Inter Display'; color: var(--chalk); letter-spacing: -0.01em; }
.callout p { font: 400 22px/1.42 Inter; color: var(--chalk2); margin-top: 10px; }
.cursor { position: absolute; width: 34px; height: 34px; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6)); }
.click { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 3px solid #8db3ff; }

/* phones */
.phone { position: absolute; width: 336px; height: 699px; border-radius: 54px; padding: 12px; background: linear-gradient(160deg, #2a3647, #0b1018 40%, #1a2230); box-shadow: 0 50px 110px rgba(0, 0, 0, 0.7), inset 0 0 0 2px rgba(255, 255, 255, 0.07); }
.phone .scr { position: relative; width: 312px; height: 675px; border-radius: 43px; overflow: hidden; background: #0b1220; }
.phone .scr img { position: absolute; inset: 0; width: 312px; height: 675px; }
.phone .island { position: absolute; left: 50%; top: 22px; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #000; z-index: 3; }
.phone .glare { position: absolute; inset: 0; border-radius: 43px; background: linear-gradient(125deg, rgba(255, 255, 255, 0.10), transparent 32%); z-index: 4; }
.plabel { position: absolute; width: 380px; text-align: center; font: 600 24px/1.3 'Inter Display'; color: var(--chalk); }
.plabel span { display: block; font: 400 19px/1.35 Inter; color: var(--fog); margin-top: 4px; }

.metric { display: flex; align-items: baseline; gap: 22px; }
.metric b { font: 750 80px/1 'Inter Display'; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.metric span { font: 500 24px/1.3 Inter; color: var(--chalk2); max-width: 400px; }
.bul { list-style: none; display: grid; gap: 10px; margin-top: 14px; }
.bul li { position: relative; padding-left: 22px; font: 400 22px/1.38 Inter; color: var(--chalk2); }
.bul li::before { content: ""; position: absolute; left: 2px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc, #7ea8ff); }
.sdg { position: absolute; width: 168px; height: 168px; border-radius: 10px; padding: 14px 16px; color: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
.sdg b { display: block; font: 800 64px/0.95 'Inter Display'; letter-spacing: -0.03em; }
.sdg span { display: block; font: 700 17px/1.18 Inter; margin-top: 10px; }

/* v2 */
.why { position: absolute; padding: 34px 44px 40px; border-radius: 26px; background: linear-gradient(180deg, rgba(22, 34, 52, 0.95), rgba(12, 19, 31, 0.96)); border: 1px solid rgba(126, 168, 255, 0.3); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6); }
.why .mark { display: inline-block; font: 700 21px/1 Inter; color: #0b1220; background: #f5dd8f; padding: 8px 14px; border-radius: 999px; }
.why .q { font: 700 58px/1.08 'Inter Display'; letter-spacing: -0.02em; color: #fff; margin-top: 20px; text-wrap: balance; }
.why .a { font: 400 28px/1.42 Inter; color: #b8c5d6; margin-top: 18px; }
.feat { display: block; padding: 16px 24px; margin-bottom: 14px; border-radius: 18px; border: 1px solid var(--line2); background: rgba(23, 35, 52, 0.7); }
.feat b { display: block; font: 650 30px/1.2 'Inter Display'; color: #ebf0f6; }
.feat span { display: block; font: 400 22px/1.4 Inter; color: #b8c5d6; margin-top: 6px; }
.feat.on { border-color: #8db3ff; background: rgba(47, 111, 224, 0.2); box-shadow: 0 0 34px rgba(126, 168, 255, 0.28); }
.cmp { padding: 16px 20px; margin-bottom: 18px; border-radius: 16px; border: 1px solid rgba(227, 195, 90, 0.45); background: rgba(227, 195, 90, 0.08); }
.cmp span { display: block; font: 600 18px/1.2 Inter; color: #8696ad; }
.cmp b { display: block; font: 600 24px/1.3 Inter; color: #ebf0f6; margin-top: 6px; }
.cmp.n { border-color: rgba(134, 150, 173, 0.45); background: rgba(134, 150, 173, 0.08); }
.eta { display: grid; grid-template-columns: 110px 190px 1fr; align-items: center; gap: 16px; padding: 16px 22px; margin-bottom: 12px; border-radius: 16px; border: 1px solid var(--line2); background: rgba(23, 35, 52, 0.75); font: 500 22px/1.2 Inter; color: #b8c5d6; }
.eta span { font: 650 24px 'Inter Display'; color: #ebf0f6; }
.eta b { font: 700 26px 'Inter Display'; color: #8db3ff; }
.eta i { font-style: normal; }
.eta.on { border-color: #2dd4bf; background: rgba(45, 212, 191, 0.13); }
.tag { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: rgba(10, 17, 28, 0.92); border: 1px solid rgba(52, 229, 138, 0.5); font: 500 20px/1.2 Inter; color: #ebf0f6; white-space: nowrap; }
.tag b { font-weight: 600; }
.tag i { font-style: normal; color: #7ff0b4; font-size: 17px; margin-left: 6px; }
.tapdot { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0 28%, rgba(255, 255, 255, 0.35) 52%, rgba(255, 255, 255, 0) 72%); z-index: 6; display: none; }
.ripple { position: absolute; width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.85); z-index: 6; display: none; }
.phl { position: absolute; border-radius: 14px; border: 3px solid #f5dd8f; box-shadow: 0 0 24px rgba(245, 221, 143, 0.6); z-index: 5; display: none; }
.hwrow { display: flex; align-items: center; gap: 22px; padding: 26px 34px; border-bottom: 1px solid rgba(126, 168, 255, 0.14); position: relative; }
.hwi { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; background: rgba(255, 77, 94, 0.14); color: #ff6b78; flex: none; }
.hwrow b { display: block; font: 650 30px/1.2 'Inter Display'; color: #ebf0f6; }
.hwrow span { display: block; font: 400 21px/1.3 Inter; color: #8696ad; margin-top: 4px; }
.hwrow .x { position: absolute; left: 24px; right: 24px; top: 50%; height: 4px; background: #ff4d5e; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(0); box-shadow: 0 0 12px rgba(255, 77, 94, 0.6); }
.layer { position: absolute; left: 44px; right: 44px; padding: 30px 36px; border-radius: 22px; }
.layer.sw { top: 44px; border: 1px solid rgba(126, 168, 255, 0.6); background: rgba(47, 111, 224, 0.17); }
.layer.hw2 { top: 320px; border: 1px solid rgba(52, 229, 138, 0.45); background: rgba(52, 229, 138, 0.08); }
.layer b { display: block; font: 650 34px/1.2 'Inter Display'; color: #ebf0f6; }
.layer .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.layer i { display: block; font-style: normal; margin-top: 16px; font: 500 20px/1.3 Inter; color: #b8c5d6; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
// ------------------------------------------------------------------ utilities
const W = 1920, H = 1080, FPS = 30;
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  out2: (p) => 1 - (1 - p) * (1 - p),
  out3: (p) => 1 - Math.pow(1 - p, 3),
  out4: (p) => 1 - Math.pow(1 - p, 4),
  out5: (p) => 1 - Math.pow(1 - p, 5),
  in2: (p) => p * p,
  io2: (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
  io3: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },

const P = (t, a, b, e = E.out3) => e(clamp((t - a) / (b - a)));
const env = (t, a, b, fi = 0.45, fo = 0.45) => Math.min(P(t, a, a + fi, E.io2), 1 - P(t, b - fo, b, E.io2));
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  e.style.opacity = o.toFixed(3);
  e.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${s.toFixed(4)})`;
  e.style.filter = blur > 0.1 ? `blur(${blur.toFixed(2)}px)` : '';

}
function rev(e, t, a, d = 0.8, dy = 34, blur = 10, ease = E.out4) { const p = P(t, a, a + d, ease); st(e, p, (1 - p) * dy, 1, (1 - p) * blur); return p; }
// reveal in, then fade out at b
function revx(e, t, a, b, d = 0.8, dy = 34) { const p = P(t, a, a + d, E.out4); const q = 1 - P(t, b - 0.45, b, E.io2); st(e, p * q, (1 - p) * dy - (1 - q) * 18, 1, (1 - p) * 10 + (1 - q) * 6); }
function words(parent, text, cls, style) {

}
function revWords(box, t, a, stag = 0.08, d = 0.75) {

}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function canvas(w, hh, parent, x, y) { const c = h('canvas', 'abs', parent); c.width = w; c.height = hh; if (x != null) at(c, x, y); c.style.width = w + 'px'; c.style.height = hh + 'px'; return c; }
const FMT = (n) => Math.round(n).toLocaleString('en-US');

const IC = {
  cctv: '<path d="M3 8.5 15.5 5l1.8 6.2L4.8 14.7z"/><path d="M17.3 9.2l3.2-.9.9 3.4-3.3.9"/><path d="M8 13.4 9 18H4"/><circle cx="7" cy="9.8" r=".6"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  check: '<rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m8 9 1.6 1.6L12.8 7.4M8 15l1.6 1.6 3.2-3.2M15 9h1.5M15 15h1.5"/>',
  gate: '<path d="M4 20V9M2.5 20h3"/><rect x="2.8" y="6" width="2.4" height="3" rx=".6"/><path d="M5.5 7.5h15"/><path d="M8 7.5l1.6-1.6M12 7.5l1.6-1.6M16 7.5l1.6-1.6"/>',
  release: '<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/><path d="M12 8v4l2.6 1.8"/>',
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.3.2 4 1.8 4.6 4.8"/>',
  shop: '<path d="M4 9h16l-1.2 10.5a1.6 1.6 0 0 1-1.6 1.5H6.8a1.6 1.6 0 0 1-1.6-1.5z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 16.5 9 5 9-5"/>',
  leaf: '<path d="M5 19c0-8 5.5-13.5 15-14-.4 9.6-6 15-14 15"/><path d="M5 19c3-4 6-6.5 10-8.5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16.5 6.5l2.5 2.5M14 9l2 2"/>',
  star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/>',
  ticket: '<path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h14a1.5 1.5 0 0 1 1.5 1.5V10a2 2 0 0 0 0 4v2.5A1.5 1.5 0 0 1 19 18H5a1.5 1.5 0 0 1-1.5-1.5V14a2 2 0 0 0 0-4z"/><path d="M14.5 6v12" stroke-dasharray="1.6 2"/>',
  flag: '<path d="M5 21V4M5 4.5h11l-2 4 2 4H5"/>',
  done: '<path d="m5 12.5 4.2 4.2L19 7"/>',
};
const icon = (k) => `<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`;

// ------------------------------------------------------------------ drawing kit
function rr(c, x, y, w, hh, r) { c.beginPath(); c.roundRect(x, y, w, hh, r); }
const PAINT = ['#c9d2de', '#8f9bad', '#e6eaf0', '#5f6d80', '#aab4c3', '#86424c', '#3d5c96', '#6b7a6b', '#b7a58f'];
// top-down car centred on (x, y), front pointing up before rotation
function car(c, x, y, w, hh, color, o = {}) {
  c.save(); c.translate(x, y); if (o.rot) c.rotate(o.rot); c.globalAlpha = o.a == null ? 1 : o.a;
  const r = Math.min(w, hh) * 0.3;
  if (o.ghost) {
    c.setLineDash([6, 5]); c.lineWidth = 2.2; c.strokeStyle = color; rr(c, -w / 2, -hh / 2, w, hh, r); c.stroke(); c.setLineDash([]);
    c.restore(); return;
  }
  c.fillStyle = 'rgba(0,0,0,0.38)'; rr(c, -w / 2 + 2, -hh / 2 + 4, w, hh, r); c.fill();
  const g = c.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, color); g.addColorStop(0.5, shade(color, 1.12)); g.addColorStop(1, shade(color, 0.82));
  c.fillStyle = g; rr(c, -w / 2, -hh / 2, w, hh, r); c.fill();
  c.fillStyle = 'rgba(8,14,24,0.78)';
  rr(c, -w / 2 + w * 0.13, -hh / 2 + hh * 0.2, w * 0.74, hh * 0.19, 3); c.fill();
  rr(c, -w / 2 + w * 0.16, hh / 2 - hh * 0.25, w * 0.68, hh * 0.13, 3); c.fill();

// ------------------------------------------------------------------ seek
window.seek = async function (t) {
  pending.length = 0;
  for (const s of SCENES) {
    const on = t >= s.t0 - s.fi && t < s.t1 + s.fo;
    s.root.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const a = Math.min(s.fi ? P(t, s.t0 - s.fi, s.t0 + s.fi, E.io2) : 1, s.fo ? 1 - P(t, s.t1 - s.fo, s.t1 + s.fo, E.io2) : 1);
    s.root.style.opacity = a.toFixed(3);
    s.update(t - s.t0, t);
  }
  globalUpdate(t);
  await Promise.all(pending);
  return true;
};
