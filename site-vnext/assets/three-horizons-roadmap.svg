<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">ParkFlow three-horizon roadmap</title>
  <desc id="desc">Three connected maturity curves move from the KL East lighthouse through an SDP portfolio operating system to a contracted multi-mall platform over sixty months.</desc>
  <defs>
    <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6fe0" stop-opacity=".18"/><stop offset="1" stop-color="#2f6fe0" stop-opacity=".02"/></linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b18100" stop-opacity=".16"/><stop offset="1" stop-color="#b18100" stop-opacity=".02"/></linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#087f70" stop-opacity=".16"/><stop offset="1" stop-color="#087f70" stop-opacity=".02"/></linearGradient>
  </defs>
  <rect width="1800" height="520" fill="#ffffff"/>
  <g fill="none" stroke="#dbe2ec" stroke-width="1">
    <path d="M70 458H1740"/>
    <path d="M70 336H1740" stroke-dasharray="5 8"/>
    <path d="M70 210H1740" stroke-dasharray="5 8"/>
    <path d="M70 82H1740" stroke-dasharray="5 8"/>
  </g>
  <g stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="6 8">
    <path d="M545 50V458"/>
    <path d="M1120 50V458"/>
  </g>
  <path d="M70 446C190 444 292 432 370 386C425 354 461 336 545 336H640V458H70Z" fill="url(#blueFill)"/>
  <path d="M70 446C190 444 292 432 370 386C425 354 461 336 545 336H640" fill="none" stroke="#2f6fe0" stroke-width="7" stroke-linecap="round"/>
  <path d="M545 336C700 334 790 324 874 268C958 212 1006 210 1120 210H1215V458H545Z" fill="url(#goldFill)"/>
  <path d="M545 336C700 334 790 324 874 268C958 212 1006 210 1120 210H1215" fill="none" stroke="#b18100" stroke-width="7" stroke-linecap="round"/>
  <path d="M1120 210C1270 208 1372 194 1468 126C1542 74 1632 70 1730 70V458H1120Z" fill="url(#greenFill)"/>
  <path d="M1120 210C1270 208 1372 194 1468 126C1542 74 1632 70 1730 70" fill="none" stroke="#087f70" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-width="5">
    <circle cx="545" cy="336" r="11" fill="#2f6fe0"/>
    <circle cx="1120" cy="210" r="11" fill="#b18100"/>
    <circle cx="1730" cy="70" r="11" fill="#087f70"/>
  </g>
  <g fill="#475467" font-family="Barlow, Segoe UI, sans-serif" font-size="18">
    <text x="70" y="494">Now</text>
    <text x="545" y="494" text-anchor="middle">6 months</text>
    <text x="1120" y="494" text-anchor="middle">24 months</text>
    <text x="1730" y="494" text-anchor="end">60 months</text>
  </g>
  <g fill="#344054" font-family="Barlow, Segoe UI, sans-serif" font-size="16" font-weight="600">
    <text x="565" y="322">VALUE GATE</text>
    <text x="1140" y="196">REPEATABILITY GATE</text>
  </g>
</svg>
